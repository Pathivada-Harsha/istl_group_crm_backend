# Headings and fixed sentences for the standard (non-solar) proposal document.
#
# Everything client-specific comes from the lead and the proposal record; this file
# holds only the labels and the two boilerplate sentences. Nothing here may name a
# company, an industry or a product - the document is rendered for every
# organization on the platform, branded from its own settings.
#
# Sales owns this wording, so it lives in a .properties file a non-developer can diff.

