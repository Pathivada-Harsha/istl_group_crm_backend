spring.application.name=istl_group_crm_backend
spring.profiles.active=dev
# ── Lead BOM "last procured cost" hint ───────────────────────────────────────
# Read-only price suggestion beside each BOM line's unit rate, sourced from past
# purchase orders matched on catalog item + catalog make. Environment-neutral, so
# it lives here rather than in the per-profile files.
#
# stale-days   how old the latest purchase may be before it is flagged as stale.
# history-size how many past purchases the expand panel shows (deduped per PO).
# max-pairs    ceiling on (item, make) pairs one request may ask about.
# row-cap      runaway guard on the history query; a warning is logged if hit.
bom.purchase-hint.enabled=true
bom.purchase-hint.stale-days=90
bom.purchase-hint.history-size=3
bom.purchase-hint.max-pairs=200
bom.purchase-hint.row-cap=2000

# ── Sanction letter OCR (scanned-PDF fallback) ───────────────────────────────
# Folder containing Tesseract's language data (eng.traineddata). Not bundled
# with the tess4j dependency — download it from the tesseract-ocr/tessdata
# project and place it here on every environment. Until it's present, OCR
# fails safely (logged once) and sanction import falls back to the existing
# Groq/manual-entry behaviour, so nothing else breaks.
sanction.ocr.tessdata-path=./tessdata
