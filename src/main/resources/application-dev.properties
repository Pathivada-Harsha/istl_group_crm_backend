spring.datasource.password=123456
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.main.banner-mode=OFF
cros.allowed-origins=http://crm.sesolaenergy.com,https://crm.sesolaenergy.com,http://localhost:3000


server.servlet.session.timeout=15m
session.warning.seconds=60s

# Show only WARN and ERROR globally
logging.level.root=WARN

# Show application logs (your code)
logging.level.com.istlgroup=INFO

# Hide Hibernate SQL & startup logs
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm=OFF

# Hide Spring framework noise
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=INFO

# Hide Tomcat logs
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN

# Hide HikariCP logs
logging.level.com.zaxxer.hikari=WARN

#Error Tracing 
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
# Disable DevTools restart spam
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
# Turn off the DevTools restart file-watcher. Its background thread scans
# target/classes and throws "File must not be a directory" when a Maven rebuild
# recreates package folders mid-scan (a check/use race). We restart the app
# manually after a rebuild anyway, so auto-restart isn't needed here.
spring.devtools.restart.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
file.upload-dir=uploads/bills/



# ============================================================================
# PROJECT DASHBOARD SCHEDULER CONFIGURATION
# ============================================================================

# Enable/Disable Project Stats Scheduler
scheduler.project-stats.enabled=true

# Full Recalculation (Every 6 hours)
# Recalculates all project statistics from scratch
# Cron: 0 0 */6 * * * = At minute 0 past every 6th hour (12 AM, 6 AM, 12 PM, 6 PM)
scheduler.project-stats.full-recalc.enabled=true
scheduler.project-stats.full-recalc.cron=0 0 */6 * * *

# Fix Inconsistent Stats (Daily at 3 AM)
# Verifies and fixes any data inconsistencies
# Cron: 0 0 3 * * * = Every day at 3:00 AM
scheduler.project-stats.fix-inconsistent.enabled=true
scheduler.project-stats.fix-inconsistent.cron=0 0 3 * * *

# Stale Project Recalculation (Every 2 hours) - OPTIONAL
# Recalculates projects not updated in last 24 hours
# DISABLED by default - Enable only if needed
scheduler.project-stats.stale-recalc.enabled=false
scheduler.project-stats.stale-recalc.cron=0 0 */2 * * *

# Health Check (Every hour) - OPTIONAL
# DISABLED by default - Enable only for debugging
scheduler.project-stats.health-check.enabled=false

# ============================================================================
# LOGGING FOR PROJECT DASHBOARD (Optional but recommended)
# ============================================================================

# Project Dashboard Service Logs
logging.level.com.istlgroup.crm.service.ProjectStatsService=INFO
logging.level.com.istlgroup.crm.service.ProjectDashboardService=INFO
logging.level.com.istlgroup.crm.scheduler.ProjectStatsScheduler=INFO



