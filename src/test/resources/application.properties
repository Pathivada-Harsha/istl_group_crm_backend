# Test-only configuration.
#
# This file sits on the TEST classpath and shadows src/main/resources/application.properties,
# so it decides which profile tests run under — regardless of what the main file says.
#
# WHY IT EXISTS: several tests are @SpringBootTest and load the real datasource
# (IstlGroupCrmBackendApplicationTests, LeadAdminServiceTest, LeadScopeServiceTest,
# LeadSuggestionServiceTest, DashboardTeamScopeTest). Without this file they inherit
# spring.profiles.active from the main properties — which was set to "prod", pointing at
# the production MySQL at 164.52.201.231. That means "mvnw install" ran the test suite
# against the live database. The writing tests are @Transactional and roll back, and
# ddl-auto is "validate", so nothing was committed — but the safety of production data
# was resting on every future test remembering to be transactional. It shouldn't.
#
# Pinning to dev here means a test run can only ever touch the local database, whatever
# the main file is switched to. If a developer genuinely needs to point tests elsewhere,
# override explicitly: mvnw test -Dspring.profiles.active=<profile>
spring.profiles.active=dev
