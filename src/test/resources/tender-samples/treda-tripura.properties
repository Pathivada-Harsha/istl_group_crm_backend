# TREDA (Tripura Renewable Energy Development Agency) — 105-page state NIT.
# Template A: labelled prose, money as Rs.12,66,67,376/-, "BID INFORMATION
# SHEET" on page 3, a three-line running header on all 105 pages.
#
# Every value below was read off the PDF by hand. A key with an empty value
# asserts the field must come back BLANK — the document does not state it, and
# blank is a pass.
#
# Suffixes: .startsWith / .contains / .page   (bare key = exact match)

pages          = 105
complete       = true
summary.from   = 2
summary.to     = 4

# ── identification ──
# The reference is "DNIe-T No.F.6 (542)/TREDA/NCES/2025-26/2110, dated
# 12/06/2026". DNIe-T is the label; the date after the comma is not the number.
tenderNumber        = F.6 (542)/TREDA/NCES/2025-26/2110
tenderNumber.page   = 1
tenderName.startsWith = Design, survey, manufacture, supply, erection, testing, commissioning of 10 kWp & 5 kWp
tenderName.contains   = throughout the state of Tripura

# Unlabelled — a standalone heading on page 1. The labelled phrases
# ("Tendering Authority") appear only in a bank-guarantee clause 30 pages in.
issuingAuthority      = TRIPURA RENEWABLE ENERGY DEVELOPMENT AGENCY
issuingAuthority.page = 1

# ── contact ──
# Printed as "email-tredatenders25@gmail.com" with no space; the prefix is not
# part of the local part.
clientContactEmail  = tredatenders25@gmail.com
clientAddress       = Vigyan Bhawan, Pandit Nehru Complex, Gorkhabasti, Agartala, Tripura

# ── commercial ──
# Rs.12,66,67,376/- and Rs. 31,66,684/- ; EMD is 2.50% of the estimate.
estimatedValue      = 126667376
estimatedValue.page = 3
emdAmount           = 3166684
emdAmount.page      = 3
# "an amount equal to the 5% of the total contract value", clause 2.9.1 —
# NOT the "less than 10% of the estimated cost" threshold in the same sentence.
performanceSecurityPct = 5

# ── dates (day-first: 03/07/2026 is 3 July) ──
# Item 12 "Bid Submission End Date & time", not item 10's clarification close.
submissionDeadline   = 2026-07-03
technicalOpeningDate = 2026-07-03
financialOpeningDate =

# From the reference (2025-26), not from the June 2026 publication date.
financialYear = 2025-26

# ── classification ──
sector      = Solar EPC
source      = State Portal
portalLink  = https://tripuratenders.gov.in
state       = Tripura
clientType  = Government

# ── must stay blank ──
# An NIT names the procuring agency; it does not publish that agency's
# registrations, and none of these appear anywhere in the document.
clientGstin         =
clientPan           =
clientCin           =
clientContactPerson =
clientContactPhone  =
# The work is "throughout the state of Tripura" — there is no tender type
# stated in the summary either.
tenderType          =
