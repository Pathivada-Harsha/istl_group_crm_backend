# IREPS (Indian Railways e-procurement) — Madurai station rooftop solar, 2 pages.
# Template B: a two-column grid, TWO label/value pairs per line, money as bare
# decimals with no symbol and no grouping.
#
# A key with an empty value asserts the field must come back BLANK.

pages        = 2
complete     = true
summary.from = 1
summary.to   = 2

# ── identification ──
tenderNumber = E-HQ-CN-EOT09-2026-27
# The label is centred in a tall cell, so the first line of the value comes out
# ABOVE it. The whole cell is the name, not the fragment beside the label.
tenderName.startsWith = Implementation of Rooftop Solar PV System At Various Locations of Madurai (MDU) station
tenderName.contains   = through RESCO Mode

# Unlabelled: the page-1 heading. The only labelled "Tender Inviting Authority"
# in this document is the closing GFR compliance sentence.
issuingAuthority = SR-CONST-HQ-ELECTRICAL/SOUTHERN RLY

# ── commercial ──
# "Advertised Value 137837539.00 Tendering Section WORKS" — the capture stops
# at "Tendering Section". EMD is 0.78% of the advertised value.
estimatedValue = 137837539
emdAmount      = 1068000

# ── classification ──
# "Tender Type Open Bidding System Two Packet System" — the value is "Open".
tenderType = Open
# ireps.gov.in is Indian Railways' own system. The document's closing sentence
# mentions GeM; that is boilerplate, not the source.
source     = IREPS / Railways
portalLink = www.ireps.gov.in
sector     = Rooftop Solar
clientType = Government

# ── dates (day-first: 17/08/2026 is 17 August, 08/07/2026 is 8 July) ──
# "Tender Closing Date Time 17/08/2026 15:00" — the time component is dropped.
submissionDeadline   = 2026-08-17
technicalOpeningDate =
financialOpeningDate =
financialYear        = 2026-27

# ── must stay blank ──
# The document names stations and a railway division; it never names a state.
state                  =
district               =
clientGstin            =
clientPan              =
clientCin              =
clientContactPerson    =
clientContactEmail     =
clientContactPhone     =
clientAddress          =
# No performance security percentage anywhere in this template.
performanceSecurityPct =
# "Validity of Offer ( Days) 180" and "Number of JV Member Allowed 6" are bare
# numbers on money-carrying lines; neither may be read as an amount.
location               =
